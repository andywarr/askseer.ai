name: Weekly Release Notes

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  generate-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important for git log

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Cache LLM Data
        uses: actions/cache@v4
        with:
          path: apps/nextjs-app/.cache/release-notes-llm-cache.json
          # Use run_id in the key to ensure we always save a new cache (since the file changes)
          key: release-notes-llm-cache-${{ github.run_id }}
          restore-keys: |
            release-notes-llm-cache-

      - name: Generate Release Notes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node apps/nextjs-app/scripts/generate-release-notes.cjs \
            --use-llm \
            --output app/(no-auth)/notes/release-notes.generated.json

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add apps/nextjs-app/app/\(no-auth\)/notes/release-notes.generated.json
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "chore: update release notes [skip ci]"
          git push
